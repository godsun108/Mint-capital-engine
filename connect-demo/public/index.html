<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINT × Stripe Connect</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#111;background:#f5f5f3}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:32px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.badge{font-size:12px;border:1px solid #ccc;border-radius:99px;padding:6px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:20px 0}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;box-shadow:0 3px 14px #0000000a}input,textarea,select,button{box-sizing:border-box;width:100%;padding:10px 12px;margin:6px 0;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#111;color:#fff;border:0;cursor:pointer}button.secondary{background:#fff;color:#111;border:1px solid #bbb}.muted{color:#666;font-size:13px}.good{color:#08783e}.warn{color:#9a5b00}.row{display:flex;gap:8px}.row>*{flex:1}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}
</style></head><body><div class="wrap">
<header><div><h1>MINT × Stripe Connect</h1><div class="muted">Connect onboarding · platform products · destination charges</div></div><span class="badge">DEMO</span></header>
<div id="message"></div>
<section class="grid">
<div class="card"><h2>1. Create connected account</h2><input id="userId" placeholder="Your app user ID"><input id="displayName" placeholder="Display name"><input id="email" type="email" placeholder="Contact email"><button onclick="createAccount()">Create account</button><div class="muted">Demo mapping is in memory. Use your real DB in production.</div></div>
<div class="card"><h2>2. Onboard</h2><select id="accountSelect"></select><button onclick="onboard()">Onboard to collect payments</button><button class="secondary" onclick="status()">Refresh onboarding status</button><div id="status"></div></div>
<div class="card"><h2>3. Create product</h2><input id="productName" placeholder="Product name"><textarea id="description" placeholder="Description"></textarea><div class="row"><input id="price" type="number" min="0.50" step="0.01" placeholder="Price USD"><input id="currency" value="usd" maxlength="3"></div><button onclick="createProduct()">Create platform product</button></div>
</section>
<h2>Storefront</h2><div id="store" class="grid"></div><details><summary>Connected accounts</summary><pre id="accounts"></pre></details>
</div><script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(options.headers||{})},...options});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function msg(t,bad=false){$('message').innerHTML='<p class="'+(bad?'warn':'good')+'">'+t+'</p>'}
async function refresh(){try{const data=await api('/api/storefront');$('accountSelect').innerHTML=data.accounts.map(a=>'<option value="'+a.id+'">'+(a.display_name||a.contact_email||a.id)+'</option>').join('');$('accounts').textContent=JSON.stringify(data.accounts,null,2);$('store').innerHTML=data.products.map(p=>'<div class="card"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><p><b>'+money(p)+'</b></p><div class="muted">Seller: '+esc(p.metadata?.connected_account_id||'unassigned')+'</div><button onclick="buy(\''+p.id+'\')">Buy with Stripe Checkout</button></div>').join('')||'<div class="muted">No products yet.</div>'}catch(e){msg(e.message,true)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(p){const d=p.default_price;return d&&typeof d==='object'?(d.unit_amount/100).toLocaleString(undefined,{style:'currency',currency:d.currency}):'No default price'}
async function createAccount(){try{const j=await api('/api/accounts',{method:'POST',body:JSON.stringify({userId:$('userId').value,displayName:$('displayName').value,email:$('email').value})});msg('Created '+j.account.id);await refresh()}catch(e){msg(e.message,true)}}
async function onboard(){try{const id=$('accountSelect').value;if(!id)throw new Error('Create/select an account first.');const j=await api('/api/accounts/'+encodeURIComponent(id)+'/onboarding-link',{method:'POST',body:'{}'});location.href=j.url}catch(e){msg(e.message,true)}}
async function status(){try{const id=$('accountSelect').value;if(!id)throw new Error('Select an account first.');const j=await api('/api/accounts/'+encodeURIComponent(id)+'/status');$('status').innerHTML='<p>Transfers: <b>'+esc(j.transferStatus)+'</b><br>Onboarding complete: <b>'+j.onboardingComplete+'</b><br>Requirements: <b>'+esc(j.requirementsStatus||'none')+'</b></p>'}catch(e){msg(e.message,true)}}
async function createProduct(){try{const accountId=$('accountSelect').value;if(!accountId)throw new Error('Select the seller account first.');const j=await api('/api/products',{method:'POST',body:JSON.stringify({name:$('productName').value,description:$('description').value,price: Number($('price').value),currency:$('currency').value,connectedAccountId:accountId})});msg('Created product '+j.product.id);await refresh()}catch(e){msg(e.message,true)}}
async function buy(productId){try{const j=await api('/api/checkout',{method:'POST',body:JSON.stringify({productId})});location.href=j.url}catch(e){msg(e.message,true)}}
refresh();
</script></body></html>
