<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINT · Payment verified delivery</title><style>body{font:16px system-ui;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f5f3}.card{background:white;padding:32px;border:1px solid #ddd;border-radius:16px;max-width:560px}a,button{color:#111}button{padding:12px 16px;border:0;border-radius:9px;background:#111;color:#fff;cursor:pointer}.muted{color:#666}</style></head><body><div class="card"><h1>Verify & deliver</h1><p id="state">Verifying payment with MINT…</p><button id="download" hidden>Download purchased artifact</button><p class="muted">Delivery is unlocked only after server-side Stripe verification.</p><p><a href="/">Return to storefront</a></p></div><script>
const sid=new URLSearchParams(location.search).get('session_id');const state=document.getElementById('state'),btn=document.getElementById('download');
(async()=>{if(!sid){state.textContent='Missing Checkout session ID.';return}try{const r=await fetch('/api/checkout/'+encodeURIComponent(sid)+'/verify');const j=await r.json();if(!r.ok)throw new Error(j.error||'Verification failed');if(j.session?.status==='complete'&&j.session?.payment_status==='paid'){state.textContent='Payment verified. Your digital delivery is ready.';btn.hidden=false;btn.onclick=()=>location.href='/api/fulfill/'+encodeURIComponent(sid)}else state.textContent='Payment is not yet verified as complete.'}catch(e){state.textContent=e.message}})();
</script></body></html>
