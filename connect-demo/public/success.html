<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MINT · Payment verified delivery</title><style>body{font:16px system-ui;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f5f3}.card{background:white;padding:32px;border:1px solid #ddd;border-radius:16px;max-width:560px}a,button{color:#111}button{padding:12px 16px;border:0;border-radius:9px;background:#111;color:#fff;cursor:pointer}.muted{color:#666}</style></head><body><div class="card"><h1>Verify & deliver</h1><p id="state">Checking Checkout return…</p><button id="download" hidden>Download purchased artifact</button><p class="muted">Download authorization is checked server-side against Stripe. This page does not assert payment or delivery. MINT fulfillment v1.1.</p><p><a href="/">Return to storefront</a></p></div><script>
const sid=new URLSearchParams(location.search).get('session_id');
const state=document.getElementById('state'),btn=document.getElementById('download');
// The public checkout diagnostics route is intentionally disabled (HTTP 403).
// The existing /api/fulfill/:session_id endpoint independently checks Stripe's
// paid/complete state, catalog mandate, amount, currency, and artifact before
// serving any file. A checkout return URL alone is never proof of payment.
if(!sid||!/^cs_(?:live|test)_[A-Za-z0-9]+$/.test(sid)){
  state.textContent='No valid Checkout session reference was provided. If you paid, contact the seller using your Stripe receipt for support.';
}else{
  state.textContent='Checkout returned. Choose Download to have the server verify your payment and authorize delivery. If payment is pending, the server will not release the file.';
  btn.hidden=false;
  btn.onclick=()=>{
    state.textContent='Checking payment and requesting delivery…';
    window.location.assign('/api/fulfill/'+encodeURIComponent(sid));
  };
}
</script></body></html>
