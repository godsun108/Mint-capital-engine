name: Cultural Opportunity Board
on:
  workflow_dispatch:
  push:
    paths:
      - "connect-demo/cultural-intelligence.json"
      - "automation/cultural-opportunity-board.mjs"
      - ".github/workflows/cultural-opportunity-board.yml"
permissions:
  contents: read
jobs:
  concepts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node automation/cultural-opportunity-board.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cultural-opportunity-board
          path: connect-demo/exports/culture/opportunities.json
