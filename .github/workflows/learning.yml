name: MINT Learning Heartbeat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/state/demand-router.json"
      - "automation/allocate-attention.js"
      - "automation/market-motion.js"
      - "automation/prospector.js"
      - "automation/learn.js"
      - "automation/message-experiment.js"
      - "automation/observe-acquisition.js"
      - "automation/continuity-officer.js"
      - "package.json"
  schedule:
    - cron: "26 * * * *"
permissions:
  contents: write
concurrency:
  group: mint-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    env:
      MINT_COMMERCE_URL: https://mint-stripe-connect-v4-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Observe commerce and learn
        run: npm run learn:dance
      - name: Six-month continuity certification
        run: node automation/continuity-officer.js
      - name: Persist learning state
        run: |
          git add automation/state/acquisition-observations.json automation/state/commerce-observations.json automation/state/learning.json automation/state/allocation.json automation/state/market-motion.json automation/state/message-experiments.json automation/state/continuity.json docs/market/ automation/state/distribution.json
          if [ -d systems/acquisition/generated ]; then git add systems/acquisition/generated/; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "mint-learning"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "MINT learning heartbeat"
          # Other autonomous workflows may advance main while this run is learning.
          # Rebase our state-only commit and retry rather than losing the observation.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push raced with another worker; rebasing attempt $attempt/3"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to persist learning state after bounded retries"
          exit 1
