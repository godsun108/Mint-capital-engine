name: MINT Product Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "11 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: mint-product-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate executable
        run: node --check automation/product-cycle.js && node --check automation/product-executor.js && node --check agents/product-loop.js && node --check agents/orchestrator.js
      - name: Run evidence-gated product cycle
        run: npm run product:cycle
        env:
          MINT_CANDIDATE_FILE: automation/candidates.json
      - name: Execute next evidence-safe work order
        run: npm run product:execute
      - name: Persist auditable cycle state
        run: |
          git add automation/state/product-cycle.json products/
          if [ -d systems/acquisition/generated ]; then git add systems/acquisition/generated/; fi
          if git diff --cached --quiet; then
            echo "No product-cycle state change."
            exit 0
          fi
          git config user.name "mint-product-cycle"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "MINT product cycle state"
          git push
