name: MINT SEO integrity audit
on:
  workflow_dispatch:
  schedule:
    - cron: '29 11 * * 1'
  push:
    paths:
      - 'connect-demo/public/**'
      - 'connect-demo/server.js'
      - '.github/workflows/mint-seo-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check sitemap, robots, metadata, structured data and live URLs
        env:
          SITE: https://mint-stripe-connect-v4-production.up.railway.app
        run: |
          python3 - <<'PY'
          import os,re,json,sys,urllib.request,urllib.error,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          root=Path('connect-demo/public')
          issues=[]
          class Meta(HTMLParser):
              def __init__(self): super().__init__();self.title=False;self.titles=[];self.descriptions=[];self.canonicals=[];self.structured=[];self.jsonld=False;self.buf=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title':self.title=True
                  if tag=='meta' and a.get('name')=='description':self.descriptions.append(a.get('content',''))
                  if tag=='link' and a.get('rel')=='canonical':self.canonicals.append(a.get('href',''))
                  if tag=='script' and a.get('type')=='application/ld+json':self.jsonld=True;self.buf=''
              def handle_data(self,data):
                  if self.title:self.titles.append(data)
                  if self.jsonld:self.buf+=data
              def handle_endtag(self,tag):
                  if tag=='title':self.title=False
                  if tag=='script' and self.jsonld:
                      try:self.structured.append(json.loads(self.buf))
                      except:issues.append('Invalid JSON-LD')
                      self.jsonld=False
          tree=ET.fromstring((root/'sitemap.xml').read_text())
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text for x in tree.findall('.//s:loc',ns)]
          if len(urls)!=len(set(urls)):issues.append('Duplicate sitemap URLs')
          robots=(root/'robots.txt').read_text()
          if os.environ['SITE']+'/sitemap.xml' not in robots:issues.append('Robots sitemap mismatch')
          paths={'/':'index.html','/offers':'offers.html','/checklist':'checklist.html','/api-launch-checklist':'api-launch-checklist.html','/ai-workflow-kit':'ai-workflow-kit.html','/builder-launch-pack':'builder-launch-pack.html'}
          for route,filename in paths.items():
              url=os.environ['SITE']+route
              if url not in urls:issues.append('Missing sitemap entry: '+route)
              p=Meta();p.feed((root/filename).read_text())
              if not ''.join(p.titles).strip():issues.append('Missing title: '+route)
              if not any(x.strip() for x in p.descriptions):issues.append('Missing description: '+route)
              if p.canonicals!=[url]:issues.append('Canonical mismatch: '+route)
              if route in ['/api-launch-checklist','/ai-workflow-kit','/builder-launch-pack'] and not any(x.get('@type')=='Product' for x in p.structured if isinstance(x,dict)):issues.append('Missing Product JSON-LD: '+route)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MINT-SEO-Audit/1.0'}),timeout=15) as resp:
                      if resp.status!=200:issues.append('Live HTTP '+str(resp.status)+': '+route)
              except Exception as e:issues.append('Live fetch failed: '+route+' '+type(e).__name__)
          for url in urls:
              route=url.removeprefix(os.environ['SITE'])
              if route not in paths:issues.append('Sitemap URL not audited: '+route)
          print('SEO AUDIT:',len(paths),'pages;',len(urls),'sitemap URLs;',len(issues),'issues')
          for issue in issues:print('ISSUE:',issue)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a') as f:
                  f.write('## MINT SEO integrity audit\n\nPages: '+str(len(paths))+' | Issues: '+str(len(issues))+'\n\n')
                  for issue in issues:f.write('- '+issue+'\n')
          if issues:sys.exit(1)
          PY
