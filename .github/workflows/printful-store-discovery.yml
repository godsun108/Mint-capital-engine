name: Printful Store Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover Printful stores read-only
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
        run: node automation/printful-discover-stores.mjs
