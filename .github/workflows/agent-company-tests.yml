name: Agent Company Tests
on:
  pull_request:
    paths:
      - "agents/**"
  push:
    branches: [main]
    paths:
      - "agents/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node agents/runtime.test.mjs
