name: Physical Channel Readiness
on:
  workflow_dispatch:
  push:
    paths:
      - "automation/physical-channel-readiness.mjs"
      - "connect-demo/physical-commerce.json"
      - ".github/workflows/physical-channel-readiness.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node automation/physical-channel-readiness.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: physical-channel-readiness
          path: connect-demo/exports/physical/channel-readiness.json
