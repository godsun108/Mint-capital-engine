name: Printful Orbital Garden Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify read-only safety contract
        run: npm run printful:safety
      - name: Discover W101 catalog and print geometry
        run: npm run printful:discover
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbital-garden-printful-discovery
          path: connect-demo/exports/physical/orbital-garden-printful-discovery.json
