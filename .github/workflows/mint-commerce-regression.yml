name: MINT commerce regression tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'connect-demo/**'
      - '.github/workflows/mint-commerce-regression.yml'
  pull_request:
    paths:
      - 'connect-demo/**'
      - '.github/workflows/mint-commerce-regression.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: connect-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connect-demo/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Check server and payment handler syntax
        run: |
          node --check server.js
          node --check payment-webhook.js
          node --check payment-authorization.js
          node --check payment-authorization.test.js
      - name: Run unit and webhook safety tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/mint-test-output.log
      - name: Upload test output for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mint-commerce-test-output
          path: /tmp/mint-test-output.log
          if-no-files-found: warn
          retention-days: 14
      - name: Record regression result
        if: always()
        run: |
          echo '## MINT commerce regression' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the Run unit and webhook safety tests step for authoritative results.' >> "$GITHUB_STEP_SUMMARY"
