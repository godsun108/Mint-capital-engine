name: Physical SKU Scenarios
on:
  workflow_dispatch:
  push:
    paths:
      - "connect-demo/physical-sku-candidate.json"
      - "automation/physical-sku-scenarios.mjs"
      - ".github/workflows/physical-sku-scenarios.yml"
permissions:
  contents: read
jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node automation/physical-sku-scenarios.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sourced-sku-scenarios
          path: connect-demo/exports/physical/sku-scenarios.json
