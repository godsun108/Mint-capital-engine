name: MINT SCOUT
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scout/ingest.py
      - name: Observe public product demand signals
        run: python scout/product_scout.py
      - name: Synthesize related public problem evidence
        run: python scout/product_synthesize.py
      - name: Propose source-backed problems for research
        run: python scout/product_propose.py
      - name: Promote bounded source-backed proposals into product intake
        run: python scout/product_promote.py
      - name: Commit changed candidates
        run: |
          git config user.name "mint-scout"
          git config user.email "actions@users.noreply.github.com"
          git add scout/data/candidates.json automation/candidates.json automation/product-scout-observations.json automation/product-scout-synthesis.json automation/product-scout-proposals.json
          git diff --cached --quiet || git commit -m "SCOUT refresh public opportunities"
          git push
