name: MINT SCOUT
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scout/ingest.py
      - name: Commit changed candidates
        run: |
          git config user.name "mint-scout"
          git config user.email "actions@users.noreply.github.com"
          git add scout/data/candidates.json
          git diff --cached --quiet || git commit -m "SCOUT refresh public opportunities"
          git push
