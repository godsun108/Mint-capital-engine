name: Orbital Garden Submit Mockup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove safety contract
        run: npm run printful:safety
      - name: Submit exactly one approved supplier mockup task
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
        run: npm run orbital-garden:submit-mockup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbital-garden-mockup-submission
          path: connect-demo/exports/physical/orbital-garden-mockup-submission.json
          if-no-files-found: error
