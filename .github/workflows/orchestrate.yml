name: MINT ORCHESTRATOR
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
jobs:
  prioritize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python systems/orchestrate.py
      - run: |
          git config user.name "mint-orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add systems/work_queue.json
          git diff --cached --quiet || git commit -m "MINT reprioritize liquidity work"
          git push
