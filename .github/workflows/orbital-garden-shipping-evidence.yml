name: Orbital Garden Shipping Evidence
on:
  workflow_dispatch:
jobs:
  quote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current US shipping rates
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
        run: node automation/orbital-garden-shipping-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbital-garden-shipping-evidence
          path: connect-demo/exports/physical/orbital-garden-shipping-evidence.json
          if-no-files-found: error
