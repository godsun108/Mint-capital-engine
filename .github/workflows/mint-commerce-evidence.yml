name: MINT commerce evidence snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *' # Daily at 12:17 UTC; GitHub schedules are best effort.
  push:
    paths:
      - '.github/workflows/mint-commerce-evidence.yml'
concurrency:
  group: mint-commerce-evidence
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public aggregate evidence without printing customer records
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, sys
          base='https://mint-stripe-connect-v4-production.up.railway.app'
          paths=['/health','/api/acquisition/state','/api/commerce/evidence','/api/fulfillment/evidence']
          import os
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
                  f.write('## MINT production evidence (aggregate only)\\n\\n| Endpoint | HTTP | Aggregate |\\n|---|---:|---|\\n')
          for path in paths:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'MINT-Evidence-Snapshot/1.0'}),timeout=20) as r:
                      code=r.status
                      obj=json.loads(r.read(200000))
              except urllib.error.HTTPError as e:
                  code=e.code
                  try: obj=json.loads(e.read(200000))
                  except: obj={}
              except Exception as e:
                  print(path, 'transport_error',type(e).__name__)
                  sys.exit(1)
              # Only aggregate numbers and booleans; no session IDs, transaction IDs or customer data.
              safe={'path':path,'http':code,'ok':obj.get('ok')}
              if path=='/health':
                  safe.update({k:obj.get(k) for k in ['stripeConfigured','webhookConfigured','durableFulfillmentStorage','durableAcquisitionStorage']})
              elif path=='/api/acquisition/state':
                  safe.update({'semantics':obj.get('semantics'),'totals':obj.get('totals'),'durableStorageConfigured':obj.get('durableStorageConfigured')})
              elif path=='/api/commerce/evidence':
                  # Fail closed if public commerce data exposes payment locators.
                  if obj.get('schema')!='mint.commerce.evidence.v2' or 'transactions' in obj or not isinstance(obj.get('totals'),dict):
                      print('MINT_COMMERCE_PUBLIC_PRIVACY_CHECK_FAILED')
                      sys.exit(1)
                  forbidden={'sessionId','session_id','chargeId','paymentIntentId','customerEmail','customer_details','receipts','transactions'}
                  def has_sensitive_keys(value):
                      if isinstance(value,dict):
                          return any(k in forbidden or has_sensitive_keys(v) for k,v in value.items())
                      if isinstance(value,list):return any(has_sensitive_keys(v) for v in value)
                      return False
                  if has_sensitive_keys(obj) or any(type(obj['totals'].get(k)) is not int for k in ['sessions','paid','providerAvailable']):
                      print('MINT_COMMERCE_PUBLIC_PRIVACY_CHECK_FAILED')
                      sys.exit(1)
                  safe.update({'totals':obj.get('totals'),'semantics':obj.get('semantics')})
              elif path=='/api/fulfillment/evidence':
                  # Fail CI if the public endpoint leaks payment/download locator IDs.
                  forbidden={'receipts','sessionId','session_id','customerEmail','customer_details','paymentIntentId'}
                  def forbidden_keys(value):
                      if isinstance(value,dict):
                          return any(k in forbidden or forbidden_keys(v) for k,v in value.items())
                      if isinstance(value,list):return any(forbidden_keys(v) for v in value)
                      return False
                  if forbidden_keys(obj) or obj.get('schema')!='mint.fulfillment.evidence.v2' or obj.get('customerDeliveryVerified') is not False or not isinstance(obj.get('verifiedLiveDownloadStarts'),int):
                      print('MINT_FULFILLMENT_PUBLIC_PRIVACY_CHECK_FAILED')
                      sys.exit(1)
                  safe.update({'verifiedLiveDownloadStarts':obj['verifiedLiveDownloadStarts'],'customerDeliveryVerified':False,'durableStorageConfigured':obj.get('durableStorageConfigured')})
              print('MINT_EVIDENCE',json.dumps(safe,sort_keys=True))
              import os
              summary=os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary,'a',encoding='utf-8') as f:
                      f.write('| '+path+' | '+str(code)+' | '+str(safe.get('totals',safe.get('verifiedLiveDownloadStarts','—'))).replace('|','/')+' |\\n')
              if code!=200:sys.exit(1)
          PY
