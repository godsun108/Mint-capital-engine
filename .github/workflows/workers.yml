name: MINT WORKERS
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"
permissions:
  contents: write
jobs:
  worker-fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Demand Scout
        run: python automation/demand_scout.py
      - name: Product Forge
        run: python automation/worker.py
      - name: Builder
        run: python automation/builder.py
      - name: Autonomy control plane
        run: python automation/engine.py
      - run: |
          git config user.name "mint-workers"
          git config user.email "actions@users.noreply.github.com"
          git add automation/demand_summary.json automation/product_candidates.json automation/build_briefs.json automation/queue.json
          git diff --cached --quiet || git commit -m "MINT workers refresh economic work"
          git push
