name: MINT WORKERS
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"
permissions:
  contents: write
jobs:
  worker-fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Demand Scout
        run: python automation/demand_scout.py
      - name: Payment truth snapshot
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib, datetime
          url="https://mint-stripe-connect-v4-production.up.railway.app/api/money-state"
          with urllib.request.urlopen(url, timeout=20) as r:
              state=json.load(r)
          if state.get("mode") != "test":
              raise SystemExit("Safety stop: expected TEST money ledger")
          out={
            "schema":"mint.payment_truth.v1",
            "observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "mode":"test",
            "semantics":"TEST_ONLY_NOT_REVENUE",
            "totals":state.get("totals",{}),
            "transactions":state.get("transactions",[])
          }
          pathlib.Path("automation/payment_truth.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Product Forge
        run: python automation/worker.py
      - name: Builder
        run: python automation/builder.py
      - name: Autonomy control plane
        run: python automation/engine.py
      - run: |
          git config user.name "mint-workers"
          git config user.email "actions@users.noreply.github.com"
          git add automation/demand_summary.json automation/payment_truth.json automation/product_candidates.json automation/build_briefs.json automation/queue.json
          git diff --cached --quiet || git commit -m "MINT workers refresh economic work"
          git push
