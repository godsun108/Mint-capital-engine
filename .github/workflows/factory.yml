name: MINT Autonomous Factory
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore factory state
        uses: actions/cache/restore@v4
        with:
          path: automation/state
          key: mint-factory-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mint-factory-state-v1-
      - name: Factory heartbeat
        run: node automation/factory.js
      - name: Preserve factory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mint-factory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation/state/**
          if-no-files-found: warn
          retention-days: 30
      - name: Save factory state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/state
          key: mint-factory-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
