name: MINT Autonomous Factory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'systems/commerce/**'
      - 'connect-demo/**'
      - '.github/workflows/factory.yml'
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mint-autonomous-factory
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore factory state
        uses: actions/cache/restore@v4
        with:
          path: automation/state
          key: mint-factory-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mint-factory-state-v1-
      - name: Report restored state
        run: |
          if [ -f automation/state/factory-queue.json ]; then
            echo "MINT_STATE_RESTORED=true"
            node -e 'const fs=require("fs");const q=JSON.parse(fs.readFileSync("automation/state/factory-queue.json","utf8"));console.log(JSON.stringify({schema:q.schema,created_at:q.created_at,updated_at:q.updated_at,tasks:q.tasks.map(t=>({task_id:t.task_id,status:t.status,attempts:t.attempts||0}))},null,2))'
          else
            echo "MINT_STATE_RESTORED=false"
          fi
      - name: Syntax gate
        run: |
          node --check automation/factory.js
          node --check automation/deckhand.js
          node --check automation/watchtower.js
          node --check automation/prospector.js
          node --check automation/merchant.js
          node --check automation/auditor.js
          node --check automation/evidence-integrity.js
      - name: Factory heartbeat
        run: node automation/factory.js
      - name: Preserve factory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mint-factory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: automation/state/**
          if-no-files-found: warn
          retention-days: 90
      - name: Publish certification summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require("fs");
          const read=n=>{try{return JSON.parse(fs.readFileSync("automation/state/"+n,"utf8"))}catch{return null}};
          const run=read("factory-run.json"),audit=read("auditor.json"),integrity=read("evidence-integrity.json"),watch=read("watchtower.json");
          console.log("# MINT Factory Certification");
          console.log("");
          console.log("| Signal | State |");
          console.log("|---|---|");
          console.log("| Factory failures | "+(run?((run.counts?.FAILED_RETRYABLE||0)+(run.counts?.FAILED_TERMINAL||0)):"UNKNOWN")+" |");
          console.log("| WATCHTOWER | "+(watch?.ok===true?"GREEN":"NOT GREEN")+" |");
          console.log("| Evidence integrity | "+(integrity?.ok===true?"GREEN":"NOT GREEN")+" |");
          console.log("| Next constraint | "+(audit?.next_constraint||"UNKNOWN")+" |");
          console.log("| Commerce | "+(audit?.stages?.commerce?.status||"UNPROVEN")+" |");
          console.log("");
          console.log("> Commerce is never inferred from infrastructure health.");
          NODE
      - name: Save factory state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/state
          key: mint-factory-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
